# Use com:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Crie antes o banco:  CREATE DATABASE portalsaida CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/portalsaida?useSSL=false&serverTimezone=America/Cuiaba
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=TROQUE_ESTA_SENHA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
