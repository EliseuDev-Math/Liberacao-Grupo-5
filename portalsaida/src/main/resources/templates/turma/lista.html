<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Turmas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <div class="cabecalho">
    <h1>Turmas</h1>
    <a class="btn" th:if="${session.usuario.podeGerenciarCadastros}" th:href="@{/turmas/novo}">Nova turma</a>
  </div>
  <div class="tabela">
    <table>
      <tr><th>Turma</th><th>Série</th><th>Curso</th><th>Departamento</th><th th:if="${session.usuario.podeGerenciarCadastros}">Ações</th></tr>
      <tr th:each="t : ${turmas}">
      <td th:text="${t.nome}"></td>
      <td th:text="${t.serie} + 'º ano'"></td>
      <td th:text="${t.curso.nome}"></td>
      <td th:text="${t.curso.departamento.sigla}"></td>
      <td th:if="${session.usuario.podeGerenciarCadastros}" class="acoes">
        <a th:href="@{/turmas/editar/{id}(id=${t.id})}">Editar</a>
        <form th:action="@{/turmas/excluir/{id}(id=${t.id})}" method="post" onsubmit="return confirm('Confirma a exclusão?')">
          <button type="submit" class="link perigo">Excluir</button>
        </form>
      </td>
      </tr>
      <tr th:if="${#lists.isEmpty(turmas)}"><td colspan="5">Nenhum registro encontrado.</td></tr>
    </table>
  </div>
</main>
</body>
</html>
