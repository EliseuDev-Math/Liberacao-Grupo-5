<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Turma')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h1 th:text="${turma.id == null} ? 'Novo(a) turma' : 'Editar turma'"></h1>
  <form class="card" th:action="@{/turmas/salvar}" th:object="${turma}" method="post">
    <input type="hidden" th:field="*{id}" th:if="*{id != null}">
    <div class="erro" th:if="${#fields.hasErrors('*')}"><p th:each="e : ${#fields.errors('*')}" th:text="${e}"></p></div>
    <label>Nome (ex.: INFO 1A)</label>
    <input type="text" th:field="*{nome}" >
    <label>Série (1 a 4)</label>
    <input type="number" th:field="*{serie}" min="1" max="4">
    <label>Curso</label>
    <select th:field="*{cursoId}"><option value="">Selecione</option><option th:each="o : ${cursos}" th:value="${o.id}" th:text="${o.nome}"></option></select>
    <div class="botoes"><button type="submit">Salvar</button><a th:href="@{/turmas}">Cancelar</a></div>
  </form>
</main>
</body>
</html>
