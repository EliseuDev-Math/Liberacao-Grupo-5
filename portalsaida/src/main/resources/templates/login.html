<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="login">
<form class="card login-box" th:action="@{/login}" method="post">
  <h1>Portal Saída</h1>
  <p class="sub">IFMT · Campus Octayde Jorge da Silva</p>
  <div class="erro" th:if="${erro}" th:text="${erro}"></div>
  <label>Login</label>
  <input type="text" name="login" required autofocus>
  <label>Senha</label>
  <input type="password" name="senha" required>
  <div class="botoes"><button type="submit">Entrar</button></div>
</form>
</body>
</html>
