<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Departamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <div class="cabecalho">
    <h1>Departamentos</h1>
    <a class="btn" th:if="${session.usuario.admin}" th:href="@{/departamentos/novo}">Novo departamento</a>
  </div>
  <div class="tabela">
    <table>
      <tr><th>Nome</th><th>Sigla</th><th th:if="${session.usuario.admin}">Ações</th></tr>
      <tr th:each="d : ${departamentos}">
      <td th:text="${d.nome}"></td>
      <td th:text="${d.sigla}"></td>
      <td th:if="${session.usuario.admin}" class="acoes">
        <a th:href="@{/departamentos/editar/{id}(id=${d.id})}">Editar</a>
        <form th:action="@{/departamentos/excluir/{id}(id=${d.id})}" method="post" onsubmit="return confirm('Confirma a exclusão?')">
          <button type="submit" class="link perigo">Excluir</button>
        </form>
      </td>
      </tr>
      <tr th:if="${#lists.isEmpty(departamentos)}"><td colspan="3">Nenhum registro encontrado.</td></tr>
    </table>
  </div>
</main>
</body>
</html>
