<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Liberações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <div class="cabecalho">
    <h1>Liberações de saída</h1>
    <a class="btn" th:if="${session.usuario.podeAutorizar}" th:href="@{/liberacoes/nova}">Nova liberação</a>
  </div>
  <form class="filtro" method="get" th:action="@{/liberacoes}">
    <label>Data: <input type="date" name="data" th:value="${data}" onchange="this.form.submit()"></label>
    <a th:if="${data != null}" th:href="@{/liberacoes}">Limpar filtro</a>
  </form>
  <div class="tabela">
    <table>
      <tr><th>Saída</th><th>Turma</th><th>Quem sai</th><th>Motivo</th><th>Autorizado por</th><th>Status</th><th></th></tr>
      <tr th:each="l : ${liberacoes}">
        <td th:text="${#temporals.format(l.dataHoraSaida,'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${l.turma.nome}"></td>
        <td th:text="${l.aluno != null} ? ${l.aluno.nome} : 'Turma inteira'"></td>
        <td th:text="${l.motivo.descricao}"></td>
        <td th:text="${l.autorizadoPor.nome}"></td>
        <td><span class="badge" th:classappend="${l.status.name() == 'AUTORIZADA'} ? 'ok' : 'cancelada'" th:text="${l.status.descricao}"></span></td>
        <td><a th:href="@{/liberacoes/{id}(id=${l.id})}">Ver</a></td>
      </tr>
      <tr th:if="${#lists.isEmpty(liberacoes)}"><td colspan="7">Nenhuma liberação encontrada.</td></tr>
    </table>
  </div>
</main>
</body>
</html>
