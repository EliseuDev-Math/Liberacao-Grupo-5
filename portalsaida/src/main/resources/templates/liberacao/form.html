<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova liberação')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <h1>Nova liberação de saída</h1>
  <form class="card" th:action="@{/liberacoes/salvar}" th:object="${liberacao}" method="post">
    <div class="erro" th:if="${#fields.hasErrors('*')}"><p th:each="e : ${#fields.errors('*')}" th:text="${e}"></p></div>

    <label>Tipo de liberação</label>
    <select th:field="*{tipo}" id="tipo">
      <option th:each="o : ${tipos}" th:value="${o}" th:text="${o.descricao}"></option>
    </select>

    <label>Turma</label>
    <select th:field="*{turmaId}" id="turma">
      <option value="">Selecione</option>
      <option th:each="o : ${turmas}" th:value="${o.id}" th:text="${o.nome + ' — ' + o.curso.nome}"></option>
    </select>

    <div id="blocoAluno">
      <label>Aluno</label>
      <select th:field="*{alunoId}" id="aluno">
        <option value="">Selecione</option>
        <option th:each="o : ${alunos}" th:value="${o.id}" th:attr="data-turma=${o.turma.id}" th:text="${o.nome + ' (' + o.matricula + ')'}"></option>
      </select>
    </div>

    <label>Data e hora da saída</label>
    <input type="datetime-local" th:field="*{dataHoraSaida}">

    <label>Motivo</label>
    <select th:field="*{motivo}">
      <option value="">Selecione</option>
      <option th:each="o : ${motivos}" th:value="${o}" th:text="${o.descricao}"></option>
    </select>

    <label>Justificativa</label>
    <textarea th:field="*{justificativa}" rows="3" maxlength="500" placeholder="Descreva o que aconteceu"></textarea>

    <label>Comprovação apresentada</label>
    <textarea th:field="*{comprovante}" rows="2" maxlength="500" placeholder="Ex.: atestado médico nº ..., ofício da coordenação, registro de ausência do professor"></textarea>

    <div class="botoes"><button type="submit">Autorizar saída</button><a th:href="@{/liberacoes}">Cancelar</a></div>
  </form>
</main>
<script>
  const tipo = document.querySelector('[name=tipo]'), turma = document.querySelector('[name=turmaId]');
  const aluno = document.querySelector('[name=alunoId]'), bloco = document.getElementById('blocoAluno');
  const todas = [...aluno.options].filter(o => o.value !== '');
  function atualizar() {
    bloco.style.display = tipo.value === 'ALUNO' ? '' : 'none';
    const atual = aluno.value;
    aluno.innerHTML = '<option value="">Selecione</option>';
    todas.filter(o => o.dataset.turma === turma.value).forEach(o => aluno.appendChild(o));
    aluno.value = tipo.value === 'ALUNO' ? atual : '';
  }
  tipo.addEventListener('change', atualizar);
  turma.addEventListener('change', () => { aluno.value = ''; atualizar(); });
  atualizar();
</script>
</body>
</html>
