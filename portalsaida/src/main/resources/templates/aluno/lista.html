<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alunos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <div class="cabecalho">
    <h1>Alunos</h1>
    <a class="btn" th:if="${session.usuario.podeGerenciarCadastros}" th:href="@{/alunos/novo}">Novo aluno</a>
  </div>
  <form class="filtro" method="get" th:action="@{/alunos}">
    <select name="turmaId" onchange="this.form.submit()">
      <option value="">Todas as turmas</option>
      <option th:each="t : ${turmas}" th:value="${t.id}" th:text="${t.nome}" th:selected="${turmaId != null and turmaId == t.id}"></option>
    </select>
  </form>
  <div class="tabela">
    <table>
      <tr><th>Matrícula</th><th>Nome</th><th>Turma</th><th th:if="${session.usuario.podeGerenciarCadastros}">Ações</th></tr>
      <tr th:each="a : ${alunos}">
      <td th:text="${a.matricula}"></td>
      <td th:text="${a.nome}"></td>
      <td th:text="${a.turma.nome}"></td>
      <td th:if="${session.usuario.podeGerenciarCadastros}" class="acoes">
        <a th:href="@{/alunos/editar/{id}(id=${a.id})}">Editar</a>
        <form th:action="@{/alunos/excluir/{id}(id=${a.id})}" method="post" onsubmit="return confirm('Confirma a exclusão?')">
          <button type="submit" class="link perigo">Excluir</button>
        </form>
      </td>
      </tr>
      <tr th:if="${#lists.isEmpty(alunos)}"><td colspan="4">Nenhum registro encontrado.</td></tr>
    </table>
  </div>
</main>
</body>
</html>
