<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
  <div class="cabecalho">
    <h1>Usuários</h1>
    <a class="btn" th:if="${session.usuario.admin}" th:href="@{/usuarios/novo}">Novo usuário</a>
  </div>
  <div class="tabela">
    <table>
      <tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Departamento</th><th>Ativo</th><th th:if="${session.usuario.admin}">Ações</th></tr>
      <tr th:each="x : ${usuarios}">
      <td th:text="${x.nome}"></td>
      <td th:text="${x.login}"></td>
      <td th:text="${x.perfil.descricao}"></td>
      <td th:text="${x.departamento != null} ? ${x.departamento.sigla} : '—'"></td>
      <td th:text="${x.ativo} ? 'Sim' : 'Não'"></td>
      <td th:if="${session.usuario.admin}" class="acoes">
        <a th:href="@{/usuarios/editar/{id}(id=${x.id})}">Editar</a>
        <form th:action="@{/usuarios/excluir/{id}(id=${x.id})}" method="post" onsubmit="return confirm('Confirma a exclusão?')">
          <button type="submit" class="link perigo">Excluir</button>
        </form>
      </td>
      </tr>
      <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6">Nenhum registro encontrado.</td></tr>
    </table>
  </div>
</main>
</body>
</html>
